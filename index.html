<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ficha Universal — Guia da Duodécima</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="standard">
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">LEGIO XII FULMINATA · SCUTUM</p>
        <h1>Ficha Universal da Duodécima</h1>
        <p class="muted">Ficha universal da Duodécima · sistema, combate, história e progressão em uma única interface.</p>
      </div>
      <div class="actions">
        <button id="exportBtn" class="ghost" type="button">Exportar JSON</button>
        <label class="ghost file-btn">Importar JSON<input id="importInput" type="file" accept="application/json"></label>
        <button id="resetBtn" class="danger" type="button">Resetar</button>
      </div>
    </header>

    <section id="creationView" class="grid two"></section>
    <section id="sheetView" class="hidden"></section>

    <footer>
      <p>SCUTUM · Ficha Universal da Legio XII Fulminata · tema padrão.</p>
    </footer>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="skills.js"></script>
  <script src="gods.js"></script>
  <script src="abilities.js"></script>
  <script src="abilities-extra.js"></script>
  <script src="system.js"></script>
  <script src="talents.js"></script>
  <script src="magic.js"></script>
  <script src="roma.js"></script>
  <script src="familiars.js"></script>
  <script src="app.js"></script>
</body>
</html>
