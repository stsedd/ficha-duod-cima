<!doctype html>
<html lang="pt-BR">
<head>

  <title>Ficha Universal — Guia da Duodécima</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="standard">
  <main class="shell">
    <header class="topbar compact-topbar">
      <div class="brand-lockup">
        <span class="brand-icon" aria-hidden="true"><img src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2230%22%20fill%3D%22%23121014%22%20stroke%3D%22%23b79a55%22%20stroke-width%3D%222%22/%3E%3Cpath%20d%3D%22M36%208%2022%2036h10l-4%2020%2014-28H32Z%22%20fill%3D%22%23f7f3e8%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2229%22%20fill%3D%22none%22%20stroke%3D%22%233c2f17%22%20stroke-width%3D%221%22/%3E%3C/svg%3E" alt=""></span>
        <div class="brand-copy">
          <p class="eyebrow">LEGIO XII FULMINATA</p>
          <h1>Ficha Universal da Duodécima</h1>
        </div>
      </div>
      <div class="actions compact-actions">
        <button id="exportBtn" class="ghost small-btn" type="button">Exportar JSON</button>
        <label class="ghost file-btn small-btn">Importar JSON<input id="importInput" type="file" accept="application/json"></label>
        <button id="resetBtn" class="danger small-btn" type="button">Resetar</button>
      </div>
    </header>

    <section id="creationView" class="grid two"></section>
    <section id="sheetView" class="hidden"></section>

    <footer>
      <p>SCUTUM · Ficha Universal da Legio XII Fulminata · tema padrão.</p>
    </footer>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="skills.js"></script>
  <script src="gods.js"></script>
  <script src="abilities.js"></script>
  <script src="abilities-extra.js"></script>
  <script src="system.js"></script>
  <script src="talents.js"></script>
  <script src="magic.js"></script>
  <script src="roma.js"></script>
  <script src="familiars.js"></script>
  <script src="app.js"></script>
</body>
</html>
